<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copiloto de búsqueda de empleo — Prototipo</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e2e2df;
    --text: #1c1c1a;
    --muted: #6b6b66;
    --accent: #7a5cff;
    --accent-ink: #ffffff;
    --ok: #1f8a4c;
    --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --surface: #1e1e24;
      --border: #33333c;
      --text: #f0f0ee;
      --muted: #a0a0a8;
      --accent: #9d85ff;
      --accent-ink: #14121f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 2rem; font-size: 0.95rem; }
  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    display: grid;
    gap: 1.1rem;
  }
  label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.4rem; }
  input[type="file"], textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    padding: 0.6rem 0.7rem;
    font-family: inherit;
    font-size: 0.95rem;
  }
  textarea { min-height: 140px; resize: vertical; }
  button {
    justify-self: start;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
  .error {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    background: color-mix(in srgb, var(--bad) 12%, transparent);
    border: 1px solid var(--bad);
    color: var(--bad);
    font-size: 0.9rem;
  }
  #result { margin-top: 2rem; display: none; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.3rem 1.5rem;
    margin-bottom: 1rem;
  }
  .card h2 { font-size: 1rem; margin: 0 0 0.7rem; }
  .score-row { display: flex; align-items: baseline; gap: 0.6rem; }
  .score { font-size: 2.4rem; font-weight: 700; }
  .score-label { color: var(--muted); font-size: 0.9rem; }
  ul { margin: 0; padding-left: 1.2rem; }
  li { margin-bottom: 0.3rem; }
  .cumplidos li::marker { color: var(--ok); }
  .faltantes li::marker { color: var(--bad); }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 0.92rem;
    margin: 0;
  }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Copiloto de búsqueda de empleo</h1>
  <p class="subtitle">
    Sube tu CV en PDF y pega la descripción de una vacante. El análisis lo
    genera un modelo local vía Ollama — tú revisas y decides qué usar,
    nada se envía ni se postula automáticamente.
  </p>

  <form id="analyze-form">
    <div>
      <label for="cv">CV (PDF)</label>
      <input type="file" id="cv" name="cv" accept="application/pdf" required />
    </div>
    <div>
      <label for="job_description">Descripción de la vacante</label>
      <textarea id="job_description" name="job_description" placeholder="Pega aquí el texto completo de la vacante..." required></textarea>
    </div>
    <button type="submit" id="submit-btn">Analizar compatibilidad</button>
    <div class="status" id="status"></div>
    <div class="error" id="error" style="display:none"></div>
  </form>

  <div id="result"></div>
</div>

<script>
const form = document.getElementById("analyze-form");
const submitBtn = document.getElementById("submit-btn");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");
const resultEl = document.getElementById("result");

function renderList(items) {
  if (!items || items.length === 0) return "<p style='color:var(--muted)'>—</p>";
  return "<ul>" + items.map(i => `<li>${escapeHtml(i)}</li>`).join("") + "</ul>";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderResult(data) {
  resultEl.innerHTML = `
    <div class="card">
      <div class="score-row">
        <span class="score">${Math.round(data.compatibilidad_estimada)}%</span>
        <span class="score-label">compatibilidad estimada</span>
      </div>
    </div>
    <div class="two-col">
      <div class="card">
        <h2>Requisitos cumplidos</h2>
        <div class="cumplidos">${renderList(data.requisitos_cumplidos)}</div>
      </div>
      <div class="card">
        <h2>Requisitos faltantes</h2>
        <div class="faltantes">${renderList(data.requisitos_faltantes)}</div>
      </div>
    </div>
    <div class="card">
      <h2>Evidencia citada del CV</h2>
      ${renderList(data.evidencia_del_cv)}
    </div>
    <div class="card">
      <h2>Recomendaciones</h2>
      ${renderList(data.recomendaciones)}
    </div>
    <div class="card">
      <h2>CV adaptado</h2>
      <pre>${escapeHtml(data.cv_adaptado || "—")}</pre>
    </div>
    <div class="card">
      <h2>Carta de presentación</h2>
      <pre>${escapeHtml(data.carta_presentacion || "—")}</pre>
    </div>
    <div class="card">
      <h2>Preguntas de entrevista sugeridas</h2>
      ${renderList(data.preguntas_entrevista_sugeridas)}
    </div>
  `;
  resultEl.style.display = "block";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorEl.style.display = "none";
  resultEl.style.display = "none";
  submitBtn.disabled = true;
  statusEl.textContent = "Analizando con el modelo local... esto puede tardar 30-90s en CPU.";

  const formData = new FormData(form);

  try {
    const res = await fetch("/analyze", { method: "POST", body: formData });
    const body = await res.json();

    if (!res.ok) {
      throw new Error(body.detail || `Error ${res.status}`);
    }

    statusEl.textContent = "";
    renderResult(body);
  } catch (err) {
    statusEl.textContent = "";
    errorEl.textContent = err.message || "Ocurrió un error inesperado.";
    errorEl.style.display = "block";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
